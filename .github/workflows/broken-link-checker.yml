# LetterCracker — Nightly Broken Link Checker
# =============================================
# Runs every night at 06:00 UTC (1:00 AM ET)
# Checks all internal links on the live site for 404s
# Results saved to broken-links-report.txt in the repo

name: Nightly Broken Link Checker

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run link checker
        run: |
          cat << 'EOF' > check-links.js
          const https = require('https');
          const http  = require('http');
          const fs    = require('fs');

          const SITE_URL = 'https://lettercracker.info';
          const PAGES = [
            '/', '/index.html', '/anagram.html', '/wordle.html',
            '/word-scramble.html', '/dictionary.html', '/random-word.html',
            '/blog.html', '/about.html', '/contact.html', '/status.html',
            '/sitemap.html', '/privacy.html', '/terms.html',
            '/disclaimer.html', '/cookies.html'
          ];

          function checkUrl(url) {
            return new Promise(resolve => {
              const lib = url.startsWith('https') ? https : http;
              const req = lib.request(url, { method: 'HEAD' }, res => {
                resolve({ url, status: res.statusCode });
              });
              req.on('error', () => resolve({ url, status: 'ERROR' }));
              req.setTimeout(8000, () => { req.destroy(); resolve({ url, status: 'TIMEOUT' }); });
              req.end();
            });
          }

          async function main() {
            const today   = new Date().toISOString().slice(0, 10);
            const results = [];
            const broken  = [];

            console.log(`Checking ${PAGES.length} pages...`);
            for (const page of PAGES) {
              const result = await checkUrl(SITE_URL + page);
              results.push(result);
              if (result.status !== 200 && result.status !== 301 && result.status !== 302) {
                broken.push(result);
                console.log(`  ❌ ${result.status} — ${result.url}`);
              } else {
                console.log(`  ✓  ${result.status} — ${result.url}`);
              }
            }

            /* Also check seo-articles from sitemap if it exists */
            try {
              const sm = fs.readFileSync('sitemap.xml', 'utf8');
              const articleUrls = (sm.match(/<loc>(.*?)<\/loc>/g) || [])
                .map(l => l.replace(/<\/?loc>/g, ''))
                .filter(u => u.includes('/seo-articles/'));
              for (const u of articleUrls.slice(0, 20)) { /* Check first 20 */
                const result = await checkUrl(u);
                results.push(result);
                if (result.status !== 200) broken.push(result);
              }
            } catch(e) {}

            const report = [
              `LetterCracker — Broken Link Report`,
              `Generated: ${new Date().toISOString()}`,
              `Total checked: ${results.length}`,
              `Broken / errors: ${broken.length}`,
              '',
              broken.length === 0
                ? '✅ All links are healthy! No issues found.'
                : '❌ BROKEN LINKS FOUND:\n' + broken.map(b => `  ${b.status} — ${b.url}`).join('\n'),
              '',
              '── Full Results ──',
              ...results.map(r => `${r.status === 200 ? '✓' : '✗'} [${r.status}] ${r.url}`)
            ].join('\n');

            fs.writeFileSync('broken-links-report.txt', report, 'utf8');
            console.log(`\nReport saved to broken-links-report.txt`);
            if (broken.length > 0) process.exit(1);
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
          node check-links.js || true

      - name: Commit report
        run: |
          git config --global user.email "autopublisher@lettercracker.info"
          git config --global user.name "LetterCracker Bot"
          git add broken-links-report.txt
          git diff --staged --quiet || git commit -m "Broken link check $(date +'%Y-%m-%d')"
          git push || true
