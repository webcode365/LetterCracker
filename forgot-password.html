<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — LetterCracker Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="themeSwitcherSlot"></div>
<div class="visitor-bar" id="visitorBar"><div class="visitor-bar-inner"><span class="live-dot"></span><span>Admin — Password Reset</span></div></div>
<div id="navSlot"></div>

<section class="page-hero">
  <h1>Reset <span class="gradient-text">Password</span></h1>
  <p>Enter your admin email to reset access</p>
</section>

<div style="padding:3rem 1.5rem 6rem;">
  <div class="form-card">
    <h2>Forgot Password?</h2>
    <p>LetterCracker stores credentials locally. You can reset directly here using your security key.</p>

    <div id="resetStep1">
      <div class="form-group">
        <label>Security Key</label>
        <input type="text" id="secKey" placeholder="Enter: LETTERCRACKER_RESET">
      </div>
      <button class="form-submit" onclick="verifyKey()">Verify →</button>
      <div class="alert alert-error" id="keyError" style="display:none;margin-top:0.75rem;">Invalid security key.</div>
    </div>

    <div id="resetStep2" style="display:none;">
      <div class="alert alert-success" style="margin-bottom:1rem;">✓ Verified! Set a new password below.</div>
      <div class="form-group">
        <label>New Username (optional)</label>
        <input type="text" id="resetUser" placeholder="Leave blank to keep current">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="resetPass" placeholder="Min. 8 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="resetConfirm" placeholder="Repeat new password">
      </div>
      <button class="form-submit" onclick="doReset()">Reset Password →</button>
      <div class="alert" id="resetMsg" style="display:none;margin-top:0.75rem;"></div>
    </div>

    <div class="form-link" style="margin-top:1.5rem;">
      <a href="admin-login.html">← Back to Login</a>
    </div>
  </div>
</div>

<div id="footerSlot"></div>
<script src="shared.js"></script>
<script>
function verifyKey() {
  const key = document.getElementById('secKey').value.trim().toUpperCase();
  if (key === 'LETTERCRACKER_RESET') {
    document.getElementById('resetStep1').style.display = 'none';
    document.getElementById('resetStep2').style.display = 'block';
  } else {
    document.getElementById('keyError').style.display = 'block';
  }
}
function doReset() {
  const u = document.getElementById('resetUser').value.trim();
  const p = document.getElementById('resetPass').value;
  const c = document.getElementById('resetConfirm').value;
  const msg = document.getElementById('resetMsg');
  if (p.length < 8) { msg.className='alert alert-error'; msg.style.display='block'; msg.textContent='Password must be 8+ characters.'; return; }
  if (p !== c) { msg.className='alert alert-error'; msg.style.display='block'; msg.textContent='Passwords do not match.'; return; }
  if (u) localStorage.setItem('lc_admin_user', u);
  localStorage.setItem('lc_admin_pass', p);
  msg.className='alert alert-success'; msg.style.display='block';
  msg.textContent='Password reset! Redirecting to login…';
  setTimeout(() => window.location.href = 'admin-login.html', 2000);
}
</script>
</body>
</html>
