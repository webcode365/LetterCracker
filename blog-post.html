      <p>Two-letter words are the foundation of expert Scrabble play. While casual players focus on finding long, impressive words, tournament champions know that two-letter words are what separate a 250-point game from a 450-point game. These tiny powerhouses let you play parallel to existing words, create double or triple scoring opportunities, and dump awkward high-point tiles you can't otherwise place.</p>

      <p>Imagine you have the tiles <strong>Q, X, Z, V, W, A, E</strong> on your rack. Without knowledge of two-letter words, you're stuck. But knowing that <strong>QI</strong>, <strong>ZA</strong>, <strong>AX</strong>, and <strong>AV</strong> are all valid opens up a completely different board.</p>

        <thead><tr><th>Word</th><th>Points</th><th>Meaning</th></tr></thead>
        <tbody>

          <tr><td class="word-col">ZA</td><td class="pts-col">11</td><td>Pizza (informal)</td></tr>
          <tr><td class="word-col">XU</td><td class="pts-col">9</td><td>Monetary unit of Vietnam</td></tr>
          <tr><td class="word-col">JO</td><td class="pts-col">9</td><td>Sweetheart (Scottish)</td></tr>
          <tr><td class="word-col">AX</td><td class="pts-col">9</td><td>Cutting tool; also AXE</td></tr>

      <p>Here are all the two-letter words organized alphabetically. Study them in groups of 10 per session — within a few weeks, you'll have them all memorized.</p>
      <p><strong>A-words:</strong> AA, AB, AD, AE, AG, AH, AI, AL, AM, AN, AR, AS, AT, AW, AX, AY</p>

    desc: 'Complete Wordle strategy guide — how to solve any Wordle in 3 guesses using optimal starting words and letter elimination.',
    content: `
      <p>Since its release, Wordle has become one of the most-played daily word games in the world. Millions of players share their results every morning. But while some players consistently solve it in 3 guesses or fewer, others regularly need 5 or 6. The difference isn't luck — it's strategy.</p>
      <h2>The Best Starting Words for Wordle</h2>
      <p>Your first guess should maximize information. You want to test as many high-frequency letters as possible. Based on letter frequency analysis of all valid 5-letter Wordle words, the statistically best starting words are:</p>
      <table class="word-table">
        <thead><tr><th>Word</th><th>Letters Covered</th><th>Why It Works</th></tr></thead>
        <tbody>
          <tr><td class="word-col">CRANE</td><td>C, R, A, N, E</td><td>Covers 5 of the top 8 most common Wordle letters</td></tr>
          <tr><td class="word-col">STARE</td><td>S, T, A, R, E</td><td>S and T are extremely common endings</td></tr>
          <tr><td class="word-col">TRACE</td><td>T, R, A, C, E</td><td>No repeated letters, all high frequency</td></tr>
          <tr><td class="word-col">AUDIO</td><td>A, U, D, I, O</td><td>Tests 4 vowels at once — ideal for vowel-heavy days</td></tr>
        </tbody>
      </table>
      <h2>The Letter Elimination Method</h2>
      <p>After your first guess, your goal is not to guess the answer immediately — it's to <strong>eliminate as many wrong letters as possible</strong>. Every grey letter is information. If you get grey on S, T, A, R, E in your first guess, you've now eliminated 5 common letters, making your second guess much more targeted.</p>
    `,
    content2: `
      <h2>Using Yellow Letters Correctly</h2>
      <p>Yellow letters are tricky. They mean the letter IS in the word, just not in that position. The key rule: on your next guess, that letter must appear somewhere else in the word. Don't put it in the same position — that's wasted information.</p>
      <h2>When to Use a Solver</h2>
      <p>If you're down to your last 2–3 guesses and still have multiple possibilities, that's the perfect time to use our <a href="wordle.html">Wordle Solver</a>. Enter your known greens, yellows, and greys to see all remaining valid words. Sometimes there are 20+ options and you need to pick the one that eliminates the most letters.</p>
      <div class="callout"><p>💡 <strong>Remember:</strong> Using a solver is completely fine. Most people play Wordle for fun and learning. There's no shame in getting a little help when you're stuck!</p></div>
    `
  },

    content: `
      <p>The Q tile is the most feared draw in Scrabble — worth 10 points but almost impossible to play without a U. Almost. There is actually a growing list of valid English words that use Q without following it with a U, and knowing them can turn a potential disaster into a game-winning play.</p>

      <p>The best Q plays often happen when you can place Q on a triple-letter square or triple-word square. At 10 base points, QI on a TLS scores 21 points before any word multipliers. On a TWS, a simple QI play can score 33 points — more than most 7-letter words.</p>
