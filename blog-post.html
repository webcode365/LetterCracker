var POSTS = {
  'scrabble-2letter': {
    title: 'The 107 Two-Letter Scrabble Words You Must Know in 2025',
    sub: "Master these and you'll unlock plays no one sees coming.",
    date: 'December 12, 2024', readTime: '8 min read',
    desc: 'Complete guide to all 107 valid two-letter words in Scrabble NWL dictionary for 2025.',
    content: '<p>Two-letter words are the foundation of expert Scrabble play. While casual players focus on finding long, impressive words, tournament champions know that two-letter words are what separate a 250-point game from a 450-point game. These tiny powerhouses let you play parallel to existing words, create double or triple scoring opportunities, and dump awkward high-point tiles you can\'t otherwise place.</p><h2>Why Two-Letter Words Matter So Much</h2><p>Imagine you have the tiles <strong>Q, X, Z, V, W, A, E</strong> on your rack. Without knowledge of two-letter words, you\'re stuck. But knowing that <strong>QI</strong>, <strong>ZA</strong>, <strong>AX</strong>, and <strong>AV</strong> are all valid opens up a completely different board.</p><h2>Essential Two-Letter Words Containing Uncommon Letters</h2><table class="word-table"><thead><tr><th>Word</th><th>Points</th><th>Meaning</th></tr></thead><tbody><tr><td class="word-col">QI</td><td class="pts-col">11</td><td>Life force in Chinese philosophy</td></tr><tr><td class="word-col">ZA</td><td class="pts-col">11</td><td>Pizza (informal)</td></tr><tr><td class="word-col">XU</td><td class="pts-col">9</td><td>Monetary unit of Vietnam</td></tr><tr><td class="word-col">JO</td><td class="pts-col">9</td><td>Sweetheart (Scottish)</td></tr><tr><td class="word-col">AX</td><td class="pts-col">9</td><td>Cutting tool; also AXE</td></tr><tr><td class="word-col">EX</td><td class="pts-col">9</td><td>Former partner</td></tr><tr><td class="word-col">OX</td><td class="pts-col">9</td><td>Bull or castrated bovine</td></tr></tbody></table><h2>Vowel-Heavy Two-Letter Words</h2><p>These are invaluable when you\'re stuck with too many vowels: <strong>AA</strong> (lava), <strong>AE</strong> (one, Scottish), <strong>AI</strong> (three-toed sloth), <strong>OE</strong> (whirlwind off Faeroe Islands), <strong>OI</strong> (exclamation), <strong>OU</strong> (man, South African).</p>',
    content2: '<h2>Quick Reference: All Valid Two-Letter Words (NWL)</h2><p>Here are all the two-letter words organized alphabetically. Study them in groups of 10 per session — within a few weeks, you\'ll have them all memorized.</p><p><strong>A-words:</strong> AA, AB, AD, AE, AG, AH, AI, AL, AM, AN, AR, AS, AT, AW, AX, AY</p><p><strong>B-words:</strong> BA, BE, BI, BO, BY</p><p><strong>C-words:</strong> CH (CSW only)</p><p><strong>D-words:</strong> DA, DE, DO</p><p><strong>E-words:</strong> ED, EF, EH, EL, EM, EN, ER, ES, ET, EW, EX</p><p><strong>F-words:</strong> FA, FE</p><p><strong>G-words:</strong> GI, GO</p><p><strong>H-words:</strong> HA, HE, HI, HM, HO</p><div class="callout"><p>💡 <strong>Pro tip:</strong> Use our <a href="index.html">Word Unscrambler</a> and filter by length "2 letters" to instantly see all two-letter plays from any set of rack tiles.</p></div>'
  },
  'wordle-strategy': {
    title: 'How to Solve Any Wordle in 3 Guesses: The Complete Strategy Guide',
    sub: 'The systematic method top players use every single day.',
    date: 'November 28, 2024', readTime: '6 min read',
    desc: 'Complete Wordle strategy guide — how to solve any Wordle in 3 guesses using optimal starting words and letter elimination.',
    content: '<p>Since its release, Wordle has become one of the most-played daily word games in the world. Millions of players share their results every morning. But while some players consistently solve it in 3 guesses or fewer, others regularly need 5 or 6. The difference isn\'t luck — it\'s strategy.</p><h2>The Best Starting Words for Wordle</h2><p>Your first guess should maximize information. You want to test as many high-frequency letters as possible. Based on letter frequency analysis of all valid 5-letter Wordle words, the statistically best starting words are:</p><table class="word-table"><thead><tr><th>Word</th><th>Letters Covered</th><th>Why It Works</th></tr></thead><tbody><tr><td class="word-col">CRANE</td><td>C, R, A, N, E</td><td>Covers 5 of the top 8 most common Wordle letters</td></tr><tr><td class="word-col">STARE</td><td>S, T, A, R, E</td><td>S and T are extremely common endings</td></tr><tr><td class="word-col">TRACE</td><td>T, R, A, C, E</td><td>No repeated letters, all high frequency</td></tr><tr><td class="word-col">AUDIO</td><td>A, U, D, I, O</td><td>Tests 4 vowels at once — ideal for vowel-heavy days</td></tr></tbody></table><h2>The Letter Elimination Method</h2><p>After your first guess, your goal is not to guess the answer immediately — it\'s to <strong>eliminate as many wrong letters as possible</strong>. Every grey letter is information. If you get grey on S, T, A, R, E in your first guess, you\'ve now eliminated 5 common letters, making your second guess much more targeted.</p>',
    content2: '<h2>Using Yellow Letters Correctly</h2><p>Yellow letters are tricky. They mean the letter IS in the word, just not in that position. The key rule: on your next guess, that letter must appear somewhere else in the word. Don\'t put it in the same position — that\'s wasted information.</p><h2>When to Use a Solver</h2><p>If you\'re down to your last 2–3 guesses and still have multiple possibilities, that\'s the perfect time to use our <a href="wordle.html">Wordle Solver</a>. Enter your known greens, yellows, and greys to see all remaining valid words. Sometimes there are 20+ options and you need to pick the one that eliminates the most letters.</p><div class="callout"><p>💡 <strong>Remember:</strong> Using a solver is completely fine. Most people play Wordle for fun and learning. There\'s no shame in getting a little help when you\'re stuck!</p></div>'
  },
  'high-value-letters': {
    title: 'Best Words Using Q Without U — Play the Q Tile Every Time',
    sub: 'Turn your most feared tile into your highest-scoring play.',
    date: 'November 14, 2024', readTime: '5 min read',
    desc: 'Complete list of valid Scrabble words using Q without U. Never get stuck with the Q tile again.',
    content: '<p>The Q tile is the most feared draw in Scrabble — worth 10 points but almost impossible to play without a U. Almost. There is actually a growing list of valid English words that use Q without following it with a U, and knowing them can turn a potential disaster into a game-winning play.</p><h2>Valid Q-Without-U Words in NWL (US Scrabble)</h2><table class="word-table"><thead><tr><th>Word</th><th>Points</th><th>Meaning</th></tr></thead><tbody><tr><td class="word-col">QI</td><td class="pts-col">11</td><td>Life force (Chinese philosophy)</td></tr><tr><td class="word-col">QOPH</td><td class="pts-col">18</td><td>Hebrew letter</td></tr><tr><td class="word-col">QANAT</td><td class="pts-col">16</td><td>Underground irrigation channel</td></tr><tr><td class="word-col">QIGONG</td><td class="pts-col">19</td><td>Chinese wellness practice</td></tr><tr><td class="word-col">QINTAR</td><td class="pts-col">15</td><td>Albanian monetary unit</td></tr><tr><td class="word-col">QWERTY</td><td class="pts-col">21</td><td>Standard keyboard layout</td></tr></tbody></table>',
    content2: '<h2>Strategy: How to Set Up Q Plays</h2><p>The best Q plays often happen when you can place Q on a triple-letter square or triple-word square. At 10 base points, QI on a TLS scores 21 points before any word multipliers. On a TWS, a simple QI play can score 33 points — more than most 7-letter words.</p><div class="callout"><p>💡 <strong>Use our tool:</strong> Next time you have Q on your rack, enter your tiles in our <a href="index.html">Word Unscrambler</a> to see every valid word you can form.</p></div>'
  },
  'words-with-friends': {
    title: 'Words With Friends vs Scrabble: Key Differences Every Player Should Know',
    sub: 'Switch between games without losing your edge.',
    date: 'October 30, 2024', readTime: '7 min read',
    desc: 'Key differences between Words With Friends and Scrabble — board layout, point values, dictionaries, and strategies.',
    content: '<p>Words With Friends and Scrabble look almost identical at first glance — both involve placing letter tiles on a grid to form words. But the differences run deep enough that strategies that win in one game can actively hurt you in the other.</p><h2>Board Layout Differences</h2><p>Scrabble uses a 15×15 grid with specific premium square placements. Words With Friends uses a slightly different premium square layout on the same grid size. This means the same word played in the same position can score very differently across the two games.</p><h2>Dictionary Differences</h2><p>Scrabble uses the <strong>NWL (North American)</strong> or <strong>CSW (International)</strong> dictionaries. Words With Friends uses the <strong>ENABLE word list</strong>, which includes some words not in Scrabble dictionaries and excludes others. Always check our <a href="dictionary.html">Dictionary Checker</a> before challenging a word.</p>',
    content2: '<h2>Point Value Differences</h2><p>Letter point values differ between the two games. In Words With Friends, some letters are worth more or less than their Scrabble equivalents. For example, the blank tile functions the same in both, but individual letter values shift the optimal play strategy.</p><div class="callout"><p>💡 <strong>Tip:</strong> Use our <a href="index.html">Word Unscrambler</a> — it calculates Scrabble point values to help you find your highest-scoring play regardless of which game you\'re playing.</p></div>'
  },
  'vocabulary-builder': {
    title: '50 Uncommon Words That Are Valid in Scrabble (And Will Shock Your Opponents)',
    sub: 'Rare but legal — words that will make opponents reach for the dictionary.',
    date: 'October 12, 2024', readTime: '10 min read',
    desc: '50 unusual but officially valid Scrabble words that will surprise your opponents and boost your score.',
    content: '<p>Scrabble mastery isn\'t just about knowing common words — it\'s about having an arsenal of unusual, surprising plays that your opponents won\'t expect and may not believe are valid. Here are 50 uncommon words that are fully official in NWL Scrabble.</p><h2>High-Value Unusual Words</h2><table class="word-table"><thead><tr><th>Word</th><th>Points</th><th>Meaning</th></tr></thead><tbody><tr><td class="word-col">ZOEAE</td><td class="pts-col">15</td><td>Plural of zoea (crustacean larva)</td></tr><tr><td class="word-col">OXAZINE</td><td class="pts-col">17</td><td>Chemical compound</td></tr><tr><td class="word-col">SYZYGY</td><td class="pts-col">26</td><td>Alignment of three celestial bodies</td></tr><tr><td class="word-col">HAJJ</td><td class="pts-col">20</td><td>Muslim pilgrimage to Mecca</td></tr><tr><td class="word-col">FJORD</td><td class="pts-col">13</td><td>Narrow sea inlet between cliffs</td></tr></tbody></table>',
    content2: '<h2>Short but Powerful Unusual Words</h2><p>Some of the best unusual words are short: <strong>PHO</strong> (Vietnamese soup), <strong>TAV</strong> (Hebrew letter), <strong>OWT</strong> (British dialect for anything), <strong>CHI</strong> (Greek letter), <strong>ZAX</strong> (slate-cutting tool).</p><div class="callout"><p>💡 <strong>Verify them:</strong> Use our <a href="dictionary.html">Dictionary Checker</a> to confirm any word before playing it in a real game.</p></div>'
  },
  'bingo-words': {
    title: 'How to Find 7-Letter Bingo Words: The Rack Management System',
    sub: 'Set up the 50-point bonus play on every single rack.',
    date: 'September 28, 2024', readTime: '9 min read',
    desc: 'How to consistently find 7-letter bingo words in Scrabble using systematic rack management techniques.',
    content: '<p>A "bingo" in Scrabble — using all 7 tiles in a single turn — earns you a 50-point bonus on top of the word score. A single bingo can completely change the direction of a game. Top players bingo multiple times per game. Here\'s how they do it.</p><h2>The SATINE Rack Principle</h2><p>Tournament players always try to keep the letters <strong>S, A, T, I, N, E</strong> on their rack. These six letters combine with almost any seventh letter to form a common 7-letter word. They\'re called "bingo-friendly" tiles because of their high combinatorial value.</p><h2>Common Bingo Stems to Memorize</h2><table class="word-table"><thead><tr><th>Stem</th><th>Add Letter</th><th>Bingo Word</th></tr></thead><tbody><tr><td class="word-col">SATINE</td><td>G</td><td>SEATING, EATINGS, INGATES</td></tr><tr><td class="word-col">RETINA</td><td>L</td><td>RELIANT, ENTRAIL, TRENAIL</td></tr><tr><td class="word-col">AIREST</td><td>D</td><td>DIATRES, TIRADES, STAIDER</td></tr></tbody></table>',
    content2: '<h2>Rack Management Strategy</h2><p>Good rack management means making sacrifices. Sometimes the highest-scoring play isn\'t the best play if it leaves you with a rack full of consonants. Think two moves ahead: trade away duplicates, keep vowel-consonant balance, and hold onto bingo-friendly letters.</p><div class="callout"><p>💡 <strong>Practice:</strong> Enter your current rack into our <a href="index.html">Word Unscrambler</a> to see all possible words including 7-letter bingos, sorted by point value.</p></div>'
  }
};
