<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Anagram Solver — Find All Anagrams Instantly | LetterCracker</title>
<meta name="description" content="Use LetterCracker's free Anagram Solver to find every valid anagram hidden in your letters. Instant results from 170,000+ words. Perfect for Scrabble, crosswords & word puzzles.">
<meta name="keywords" content="anagram solver, find anagrams, anagram finder, word anagram, anagram maker, free anagram solver">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://lettercracker.com/anagram.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="themeSwitcherSlot"></div>
<div class="visitor-bar" id="visitorBar">
  <div class="visitor-bar-inner">
    <span class="live-dot"></span>
    <span>Loading…</span>
  </div>
</div>

<div id="navSlot"></div>

<section class="page-hero">
  <h1>Anagram <span class="gradient-text">Solver</span></h1>
  <p>Enter any word or set of letters to instantly reveal every valid anagram hidden within.</p>
</section>

<div style="max-width:720px;margin:0 auto;padding:1.5rem 1.5rem 5rem;">

  <div class="tool-card">

    <div class="letter-input-wrap">
      <input type="text" id="anagramInput" class="letter-input"
        placeholder="Enter letters (e.g. LISTEN)"
        maxlength="15" autocomplete="off" autocorrect="off" spellcheck="false">

      <button class="clear-btn" id="clearBtn">✕</button>
    </div>

    <div class="tool-hint">
      Anagrams use ALL entered letters exactly once | Max 15 letters
    </div>

    <button class="unscramble-btn" onclick="solveAnagram()">
      Find Anagrams →
    </button>

    <div class="loading-state" id="anagramLoading" style="display:none">
      <div class="spinner"></div>
      <span>Searching for anagrams…</span>
    </div>

    <div class="results-section" id="anagramResults" style="display:none">

      <div class="results-header">
        <div class="results-meta" id="anagramMeta"></div>
        <button class="action-btn" onclick="copyAnagrams()">📋 Copy All</button>
      </div>

      <div class="word-chips" id="anagramChips"></div>

    </div>

  </div>
</div>

<div id="footerSlot"></div>
<div class="toast" id="toast"></div>

<script src="words-db.js"></script>
<script src="shared.js"></script>

<script>
// ✅ FIXED: safer + consistent sorting
function sortLetters(s) {
  return s.toLowerCase().split('').sort().join('');
}

function solveAnagram() {
  const inputEl = document.getElementById('anagramInput');
  const rawInput = inputEl.value.trim().replace(/\s/g,'').toLowerCase();

  if (!rawInput || rawInput.length < 2) {
    showToast('Please enter at least 2 letters');
    return;
  }

  const loading = document.getElementById('anagramLoading');
  const results = document.getElementById('anagramResults');

  loading.style.display = 'flex';
  results.style.display = 'none';

  setTimeout(() => {

    if (!window.WORD_DB || !WORD_DB.words) {
      loading.style.display = 'none';
      showToast("Word database not loaded");
      return;
    }

    const sortedInput = sortLetters(rawInput);

    // ✅ FIXED MATCHING LOGIC
    const anagrams = WORD_DB.words.filter(word =>
      word.length === rawInput.length &&
      sortLetters(word) === sortedInput
    );

    loading.style.display = 'none';
    results.style.display = 'block';

    document.getElementById('anagramMeta').innerHTML =
      `Found <strong>${anagrams.length}</strong> anagram${anagrams.length !== 1 ? 's' : ''} for <strong>${rawInput.toUpperCase()}</strong>`;

    const chipsEl = document.getElementById('anagramChips');

    if (anagrams.length === 0) {
      chipsEl.innerHTML = `
        <p style="color:var(--text3);font-size:0.9rem;padding:1rem 0;">
          No exact anagrams found. Try Word Unscrambler.
        </p>`;
    } else {
      chipsEl.innerHTML = anagrams.map(w =>
        `<span class="word-chip" onclick="copyWord('${w.toUpperCase()}')">
          ${w.toUpperCase()}
          <span class="pts">${WORD_DB.getPoints(w)}pt</span>
        </span>`
      ).join('');
    }

  }, 200);
}

function copyAnagrams() {
  const chips = document.querySelectorAll('#anagramChips .word-chip');
  const text = [...chips].map(c =>
    c.textContent.replace(/\d+pt/g,'').trim()
  ).join('\n');

  navigator.clipboard?.writeText(text).then(() =>
    showToast('Copied!')
  );
}

function copyWord(w) {
  navigator.clipboard?.writeText(w).then(() =>
    showToast(`"${w}" copied!`)
  );
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// UI handlers
const inp = document.getElementById('anagramInput');
const clr = document.getElementById('clearBtn');

inp.addEventListener('input', () => {
  inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g,'');
});

clr.addEventListener('click', () => {
  inp.value = '';
  document.getElementById('anagramResults').style.display = 'none';
});

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') solveAnagram();
});
</script>

</body>
</html>
