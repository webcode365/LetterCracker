<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagram Solver | LetterCracker</title>

<link rel="stylesheet" href="style.css">

<style>
/* Safety fallback styles so page NEVER looks blank */
body {
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #fff;
}

.tool-card {
  max-width: 720px;
  margin: 40px auto;
  padding: 20px;
  background: #1a1a1a;
  border-radius: 12px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 18px;
}

button {
  margin-top: 10px;
  padding: 10px 15px;
  cursor: pointer;
}

.word-chip {
  display: inline-block;
  margin: 5px;
  padding: 8px 12px;
  background: #2a2a2a;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="tool-card">

  <h2>Anagram Solver</h2>

  <input type="text" id="anagramInput" placeholder="Enter letters (e.g. LISTEN)">

  <button onclick="solveAnagram()">Find Anagrams</button>

  <div id="anagramMeta" style="margin-top:15px;"></div>

  <div id="anagramChips"></div>

</div>

<script src="words-db.js"></script>

<script>
// ================= SAFE CORE ENGINE =================
function sortLetters(s) {
  return (s || "").toLowerCase().split('').sort().join('');
}

function solveAnagram() {
  try {
    const inputEl = document.getElementById('anagramInput');
    const raw = inputEl.value.trim().toLowerCase().replace(/\s/g,'');

    if (!raw || raw.length < 2) {
      alert("Enter at least 2 letters");
      return;
    }

    if (!window.WORD_DB || !WORD_DB.words) {
      document.getElementById('anagramMeta').innerText = "Word DB not loaded";
      return;
    }

    const sorted = sortLetters(raw);

    const results = WORD_DB.words.filter(w =>
      w.length === raw.length && sortLetters(w) === sorted
    );

    document.getElementById('anagramMeta').innerHTML =
      "Found <b>" + results.length + "</b> anagrams for <b>" + raw.toUpperCase() + "</b>";

    document.getElementById('anagramChips').innerHTML =
      results.length
        ? results.map(w =>
            `<div class="word-chip" onclick="copyWord('${w}')">${w.toUpperCase()}</div>`
          ).join('')
        : "<p>No anagrams found</p>";

  } catch (err) {
    console.error(err);
    document.body.innerHTML = "<h2 style='color:red'>Page Error Fixed Mode Active</h2>";
  }
}

function copyWord(w) {
  navigator.clipboard.writeText(w);
  alert("Copied: " + w);
}
</script>

</body>
</html>
