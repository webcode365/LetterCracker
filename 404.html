<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem('lc_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Page Not Found — LetterCracker</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.error-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;}
.error-code{font-family:'Syne',sans-serif;font-size:7rem;font-weight:800;color:var(--accent);line-height:1;margin-bottom:.5rem;}
.error-title{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:.75rem;}
.error-msg{color:var(--text3);font-size:.95rem;max-width:440px;margin:0 auto 1.75rem;line-height:1.7;}
.error-tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:1.25rem;}
.error-tools a{padding:9px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text2);text-decoration:none;font-size:.875rem;transition:.18s;}
.error-tools a:hover{border-color:var(--accent);color:var(--accent);}
.error-tools a.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>
</head>
<body>
<div id="themeSwitcherSlot"></div>
<div class="visitor-bar" id="visitorBar"><div class="visitor-bar-inner"><span class="live-dot"></span><span>Loading…</span></div></div>
<div id="navSlot"></div>

<div class="error-wrap">
  <div>
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-msg">The page you are looking for has been moved, deleted, or never existed. Try one of our free word game tools below.</p>
    <a href="index.html" class="apply-btn" style="margin-top:0;display:inline-block;">← Back to Home</a>
    <div class="error-tools">
      <a href="index.html" class="primary">Word Unscrambler</a>
      <a href="anagram.html">Anagram Solver</a>
      <a href="wordle.html">Wordle Solver</a>
      <a href="word-scramble.html">Word Scramble</a>
      <a href="dictionary.html">Dictionary</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </div>
</div>

<div id="footerSlot"></div>
<div class="toast" id="toast"></div>
<script src="shared.js"></script>
</body>
</html>
