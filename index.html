<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LetterCracker — Free Word Unscrambler & Solver | Instant Results</title>

<meta name="description" content="LetterCracker is the fastest free word unscrambler online. Instantly unscramble letters for Scrabble, Words with Friends, Wordle & more. 170,000+ words. No signup needed.">
<meta name="keywords" content="word unscrambler, unscramble words, scrabble solver, words with friends cheat, anagram solver, wordle solver, letter unscrambler, word finder">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://lettercracker.com/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- THEME SWITCHER SLOT -->
<div id="themeSwitcherSlot"></div>

<!-- ===================== VISITOR BAR (FIXED) ===================== -->
<div class="visitor-bar" id="visitorBar">
  <div class="visitor-bar-inner">
    <span class="live-dot"></span>
    <span id="visitorText">Detecting your location...</span>
  </div>
</div>

<!-- NAV SLOT -->
<div id="navSlot"></div>

<!-- HERO -->
<section class="hero">

  <div class="hero-content">

    <div class="hero-badge">✦ Free & Instant — No Signup Required</div>

    <h1 class="hero-title">Unscramble Any<br><span class="gradient-text">Word Instantly</span></h1>

    <p class="hero-sub">
      The smartest word unscrambler for Scrabble, Words with Friends, Wordle & more.
    </p>

    <!-- TOOL -->
    <div class="tool-card">

      <div class="letter-input-wrap">
        <input type="text" id="letterInput" class="letter-input"
          placeholder="Enter letters (e.g. AELRST)">
        <button class="clear-btn" id="clearBtn">✕</button>
      </div>

      <button id="unscrambleBtn" class="unscramble-btn">Unscramble →</button>

      <div id="loadingState" class="loading-state" style="display:none;">
        Searching words...
      </div>

      <div id="resultsSection" class="results-section" style="display:none;">
        <div id="resultsMeta"></div>
        <div id="resultsByLength"></div>
      </div>

    </div>

  </div>
</section>

<!-- WORD OF THE DAY -->
<section>
  <h2 id="wotdWord">EPHEMERAL</h2>
  <p id="wotdDef">Meaning will load</p>
</section>

<!-- GAME SLOT -->
<section>
  <div id="gameBest">0</div>
</section>

<!-- ===================== FOOTER ===================== -->
<footer>
  <p>© LetterCracker</p>
</footer>

<!-- ===================== SCRIPTS ===================== -->
<script src="words-db.js"></script>
<script src="main.js"></script>

</body>
</html>
